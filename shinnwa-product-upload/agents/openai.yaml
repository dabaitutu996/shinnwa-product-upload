interface:
  display_name: "Shinnwa 商品上传"
  short_description: "核对商品表格必填资料、图片与 UPC，SKU 可生成，确认后上传并将链接写回原表"
  default_prompt: "请使用 $shinnwa-product-upload 检查这个文件夹中的商品表格和图片，先列出缺失与疑问，等我确认后上传，并将商品链接写回表格。"
dependencies:
  tools:
    - type: "mcp"
      value: "medusa_catalog"
      description: "已配置认证的 Shinnwa 商品管理 MCP；技能不包含访问密钥"
      transport: "streamable_http"
      url: "https://shinnwaapi.chaoxian.online/catalog-mcp"
policy:
  allow_implicit_invocation: true
