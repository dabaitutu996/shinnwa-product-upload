interface:
  display_name: "Shinnwa / baibu 商品上传"
  short_description: "核对商品表格必填资料、图片与 UPC，SKU 可生成，确认后上传并将链接写回原表"
  default_prompt: "请使用 $shinnwa-product-upload 先问我要上传到 Shinnwa 还是 baibu，再检查商品表格和图片，等我确认后上传，并将商品链接写回表格。"
dependencies:
  tools:
    - type: "mcp"
      value: "medusa_catalog"
      description: "已配置认证的共用商品上传连接，支持 Shinnwa 和 baibu"
      transport: "streamable_http"
      url: "https://shinnwaapi.chaoxian.online/catalog-mcp"
policy:
  allow_implicit_invocation: true
